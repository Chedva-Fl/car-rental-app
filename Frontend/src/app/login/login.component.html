<div class="page">

  <div class="card">

    <div class="card-header">
      <h2>Welcome Back</h2>
      <p>Login to your Cars Rental account</p>
    </div>

    <form (ngSubmit)="login()" class="form">

      <div class="input-group">
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          required 
          placeholder=" ">
        <label>Email</label>
      </div>

      <div class="input-group">
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          required 
          placeholder=" ">
        <label>Password</label>
      </div>

      <button type="submit" [disabled]="loading" class="primary-btn">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading" class="loader"></span>
      </button>

    </form>

    <!-- Register Section -->
    <div class="register-section">
      <span>Don't have an account?</span>
      <!-- <button type="button" class="secondary-btn" routerLink="/register">
        Create Account
      </button> -->
      <a class="secondary-btn" routerLink="/register">Create Account</a>
    </div>

    <div *ngIf="error" class="error">
      {{ error }}
    </div>

  </div>

</div>
