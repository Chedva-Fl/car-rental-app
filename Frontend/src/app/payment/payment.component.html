
  <div class="main-container">
    <div class="payment-horizontal-layout">
      
      <aside class="side-summary">
        <div class="summary-tag">📋 סיכום השכרה</div>
        <div class="summary-content">
          <div class="info-item">
            <span>רכב:</span>
            <strong>{{ carId }}</strong>
          </div>
          
          <div class="date-fields">
            <div class="input-group-mini">
              <label>איסוף:</label>
              <input type="date" [(ngModel)]="startDate" (change)="calculatePrice()" min="{{today}}">
            </div>
            <div class="input-group-mini">
              <label>החזרה:</label>
              <input type="date" [(ngModel)]="endDate" (change)="calculatePrice()" min="{{startDate}}">
            </div>
          </div>
  
          <div class="divider"></div>
          
          <div class="total-box">
            <label>סה"כ לתשלום:</label>
            <div class="total-val">{{ totalPrice }} ₪</div>
          </div>
        </div>
      </aside>
  
      <main class="payment-main-card">
        <div class="card-header-simple">
          <h2>פרטי אשראי</h2>
          <span class="secure-tag">🔐 תשלום מאובטח</span>
        </div>
  
        <form #paymentForm="ngForm" (ngSubmit)="submitPayment()">
          <div class="form-group">
            <label>מספר כרטיס</label>
            <input type="text" name="cc" [(ngModel)]="creditCard" required pattern="[0-9]{16}" maxlength="16" placeholder="16 ספרות ללא רווחים" class="main-input">
          </div>
  
          <div class="form-grid">
            <div class="form-group">
              <label>תוקף (MM/YY)</label>
              <input type="text" name="val" [(ngModel)]="validity" required pattern="(0[1-9]|1[0-2])\/[0-9]{2}" maxlength="5" placeholder="05/28" class="main-input">
            </div>
            <div class="form-group">
              <label>CVC</label>
              <input type="text" name="cvcCode" [(ngModel)]="cvc" required pattern="[0-9]{3}" maxlength="3" placeholder="123" class="main-input">
            </div>
          </div>
  
          <div class="actions">
            <button type="button" class="btn-secondary" (click)="cancel()">ביטול</button>
            <button type="submit" class="btn-primary" [disabled]="paymentForm.invalid || isProcessing || totalPrice <= 0">
              {{ isProcessing ? 'מעבד...' : 'אשר הזמנה ותשלום' }}
            </button>
          </div>
        </form>
      </main>
  
    </div>
  </div>
